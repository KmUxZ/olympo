<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argos · OLYMPO</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#111827" />
    <style>
      /* Pantalla de carga mientras llega la aplicación (la misma que dibuja Splash en brand.tsx). */
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; background: #f7f8fc; font: 800 1.25rem system-ui, sans-serif; letter-spacing: 0.02em; text-transform: uppercase; color: #111827; }
      .boot-ring { transform-box: view-box; transform-origin: 24px 25.7px; animation: boot-spin 1.1s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg width="76" height="76" viewBox="0 0 48 48" aria-hidden="true">
          <path class="boot-ring" d="M9.5 39.5A20 20 0 1 1 38.5 39.5" fill="none" stroke="#386bff" stroke-width="6.5" />
          <path d="M6 42 18 27l5 5 6-9 13 19z" fill="#386bff" />
        </svg>
        Olympo
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
